steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/third-camera-487000-k9/navio', '.']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/third-camera-487000-k9/navio']

  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'navio'
      - '--image=gcr.io/third-camera-487000-k9/navio'
      - '--region=us-central1'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--set-env-vars=GCP_PROJECT_ID=third-camera-487000-k9,GCP_REGION=us-central1,GEMINI_MODEL=gemini-2.5-flash'
      - '--update-secrets=BRIGHTDATA_API_TOKEN=brightdata-token:latest'

options:
  logging: CLOUD_LOGGING_ONLY
